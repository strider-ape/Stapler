<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <!-- Master app icon. The Android launcher icon in app/src/main/res uses the same 108-unit
       geometry; keep both in sync. -->
  <title>Stapler</title>
  <rect width="108" height="108" rx="24" fill="#3D5AFE"/>
  <!-- Scaled up so the artwork fills more of the launcher circle; matches the outer group
       in the Android icon layers. -->
  <g transform="translate(54 54) scale(1.16) translate(-53 -55)">
    <!-- Back page, fanned out around the staple -->
    <g transform="rotate(-10 41 41.5)">
      <path fill="#B7C2FF" d="M37,33.5h28a4,4 0 0 1 4,4v38a4,4 0 0 1 -4,4h-28a4,4 0 0 1 -4,-4v-38a4,4 0 0 1 4,-4z"/>
    </g>
    <!-- Front page -->
    <path fill="#FFFFFF" d="M37,33.5h28a4,4 0 0 1 4,4v38a4,4 0 0 1 -4,4h-28a4,4 0 0 1 -4,-4v-38a4,4 0 0 1 4,-4z"/>
    <path fill="none" stroke="#DDE2FF" stroke-width="3.5" stroke-linecap="round" d="M40,58H62M40,65H62M40,72H54"/>
    <!-- Staple shadow -->
    <g transform="translate(0.9 1.1) rotate(-45 41 41.5)">
      <path fill="#D3D9F2" d="M35.4,39.6h11.2a1.9,1.9 0 0 1 0,3.8h-11.2a1.9,1.9 0 0 1 0,-3.8z"/>
    </g>
    <!-- Staple: steel body, highlight, and darker ends where it pierces the paper -->
    <g transform="rotate(-45 41 41.5)">
      <path fill="#7D879C" d="M35.4,39.6h11.2a1.9,1.9 0 0 1 0,3.8h-11.2a1.9,1.9 0 0 1 0,-3.8z"/>
      <path fill="none" stroke="#E9EDF4" stroke-width="1" stroke-linecap="round" d="M36,40.6H46"/>
      <path fill="#4F576A" d="M34.7,39.6a1.2,1.2 0 0 1 1.2,1.2v1.4a1.2,1.2 0 0 1 -1.2,1.2a1.2,1.2 0 0 1 -1.2,-1.2v-1.4a1.2,1.2 0 0 1 1.2,-1.2z"/>
      <path fill="#4F576A" d="M47.3,39.6a1.2,1.2 0 0 1 1.2,1.2v1.4a1.2,1.2 0 0 1 -1.2,1.2a1.2,1.2 0 0 1 -1.2,-1.2v-1.4a1.2,1.2 0 0 1 1.2,-1.2z"/>
    </g>
  </g>
</svg>
